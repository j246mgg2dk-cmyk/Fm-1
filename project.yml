# Generate the Xcode project with:  brew install xcodegen && xcodegen
name: ModLab
options:
  bundleIdPrefix: com.modularmayhem
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  FM1Core:
    path: .

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  ModLab:
    type: application
    platform: iOS
    sources:
      - path: App
    # Required for hosting: without the Inter-App Audio entitlement iPadOS hides
    # every third-party AUv3 from this app and only lists Apple's built-in units.
    entitlements:
      path: App/ModLab.entitlements
      properties:
        inter-app-audio: true
    dependencies:
      - package: FM1Core
        product: FM1Core
      - sdk: AVFoundation.framework
      - sdk: AudioToolbox.framework
      - sdk: CoreAudioKit.framework
      - sdk: CoreMIDI.framework
      # Ableton Link (optional): download LinkKit.xcframework into Vendor/ and uncomment.
      # - framework: Vendor/LinkKit.xcframework
    settings:
      base:
        PRODUCT_NAME: Mod-Lab
        PRODUCT_BUNDLE_IDENTIFIER: com.modularmayhem.modlab   # change to your own
        TARGETED_DEVICE_FAMILY: "2"                   # iPad
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        DEVELOPMENT_TEAM: LXPC6567AX                  # Joe Rodriguez-Griesel (Personal Team)
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Mod-Lab
        UILaunchScreen: {}
        # Keep the engine, MIDI clock and plugins running when you switch to AUM/Koala.
        UIBackgroundModes: [audio]
        # Allow Split View / Slide Over next to other music apps.
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSMicrophoneUsageDescription: Mod-Lab records and processes audio from your interface inputs.
        NSBluetoothAlwaysUsageDescription: Mod-Lab connects to Bluetooth MIDI controllers and synths.
        NSLocalNetworkUsageDescription: Mod-Lab uses the local network for Network MIDI and Ableton Link.
        NSBonjourServices: [_apple-midi._udp]
        # Projects and recordings visible in the Files app (On My iPad › Mod-Lab).
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: Mod-Lab Project
            LSHandlerRank: Owner
            LSItemContentTypes: [com.modularmayhem.modlab.project]
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.modularmayhem.modlab.project
            UTTypeDescription: Mod-Lab Project
            UTTypeConformsTo: [public.json]
            UTTypeTagSpecification:
              public.filename-extension: [modlab]

schemes:
  ModLab:
    build:
      targets:
        ModLab: all
