# Machinedrum engine test for iPad. Generate the Xcode project with: xcodegen
# (the generated MDEngineTest.xcodeproj is committed, so Xcode alone is enough).
name: MDEngineTest
options:
  bundleIdPrefix: com.modularmayhem
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    DEVELOPMENT_TEAM: LXPC6567AX            # Joe Rodriguez-Griesel (Personal Team)
    CODE_SIGN_STYLE: Automatic
    CLANG_CXX_LANGUAGE_STANDARD: gnu++17
    GCC_C_LANGUAGE_STANDARD: gnu11
    # No JIT on iPadOS: build the DSP56300 emulator's interpreter.
    GCC_PREPROCESSOR_DEFINITIONS: ["$(inherited)", "DSP56K_FORCE_INTERPRETER", "ASMJIT_STATIC", "DSP56300_DEBUGGER=0", "MD_TRANSPORT_DIAGNOSTICS=0", "NDEBUG", "RELEASE"]
    HEADER_SEARCH_PATHS:
      - "$(SRCROOT)/Engine/source"
      - "$(SRCROOT)/Engine/source/dsp56300/source"
      - "$(SRCROOT)/Engine/source/dsp56300/source/asmjit/src"
      - "$(SRCROOT)/Engine/source/elektron/md"
    # The emulator is useless unoptimised; optimise even in Debug.
    GCC_OPTIMIZATION_LEVEL: "3"
    SWIFT_OPTIMIZATION_LEVEL: "-O"
    ENABLE_BITCODE: NO

targets:
  MDEngine:
    type: library.static
    platform: iOS
    settings:
      base:
        GCC_WARN_INHIBIT_ALL_WARNINGS: YES
        OTHER_CFLAGS: ["-fno-strict-aliasing"]
    sources:
      - path: Engine/source/baseLib/binarystream.cpp
      - path: Engine/source/baseLib/commandline.cpp
