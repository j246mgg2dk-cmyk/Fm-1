name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  core-tests:
    name: FM1Core tests (macOS)
    # Intel runners: the arm64 macOS pool often never picks jobs up on free accounts.
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: swift test

  ios-build:
    name: iPad app build
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen
      - name: Build for iOS Simulator
        run: |
          set +e
          xcodebuild -version
          xcodebuild -project ModLab.xcodeproj -scheme ModLab \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build > build.log 2>&1
          status=$?
          echo "=== errors ==="
          grep -E "error:" build.log | sort -u | head -n 300
          echo "=== tail ==="
          tail -n 60 build.log
          exit $status
